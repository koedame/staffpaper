version: 2

# minor / patch は週に 1 本の PR にまとめる。major は依存ごとに別の PR にする。
# セキュリティ更新はグループに入らず、アラートごとにすぐ PR が立つ。
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
      npm-major:
        update-types: ["major"]
        group-by: dependency-name
