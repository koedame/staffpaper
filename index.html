<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="印刷用の五線紙を PDF で作る" />
    <title>staffpaper — 五線紙を PDF で作る</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <h1>staffpaper</h1>
      <p class="lead">印刷用の五線紙を PDF で作る</p>
      <form id="form">
        <label>
          <span>用紙</span>
          <select name="paper" id="paper"></select>
        </label>
        <label>
          <span>段組み</span>
          <select name="layout" id="layout"></select>
        </label>
        <button type="submit">PDF をダウンロード</button>
      </form>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
